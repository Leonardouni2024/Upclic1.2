    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            }
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var origFetch = proto.fetch ? proto.fetch.bind(window) : null;
              var cFetch = origFetch;
              Object.defineProperty(proto, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return cFetch || origFetch;
                },
                set: function(fn) {
                  cFetch = fn;
                }
              });
            }
          } catch (err) {}
        }
        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1) {
            e.preventDefault();
            if (e.stopImmediatePropagation) {
              e.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
    <script>
      // Single Page Apps for GitHub Pages redirect decoder
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
