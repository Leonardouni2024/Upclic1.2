<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>UpClic - Redireccionando...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://upclic.store/producto/office-2024 becomes
      // https://upclic.store/?/producto/office-2024
      (function() {
        var pathSegmentsToKeep = 0;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.host + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
    <div style="text-align: center;">
      <h2 style="color: #0066FF; margin-bottom: 8px;">Cargando UpClic...</h2>
      <p style="font-size: 14px; color: #64748b;">Redireccionando al producto seleccionado...</p>
    </div>
  </body>
</html>
