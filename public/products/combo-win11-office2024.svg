<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>

    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.45)"/>
      <stop offset="50%" stop-color="rgba(15, 23, 42, 0.18)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)"/>
    </radialGradient>

    <linearGradient id="comboFrontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="45%" stop-color="#0047BA"/>
      <stop offset="55%" stop-color="#B82E00"/>
      <stop offset="100%" stop-color="#D83B01"/>
    </linearGradient>

    <linearGradient id="comboSpineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003580"/>
      <stop offset="100%" stop-color="#0052cc"/>
    </linearGradient>

    <linearGradient id="comboTopGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#E81123"/>
    </linearGradient>

    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bgGlow)"/>

  <!-- Floor Shadow -->
  <ellipse cx="500" cy="855" rx="380" ry="45" fill="url(#floorShadow)"/>
  <ellipse cx="490" cy="845" rx="280" ry="26" fill="rgba(15, 23, 42, 0.5)"/>

  <!-- 3D BOX -->
  <!-- Top Face -->
  <polygon points="280,160 680,140 740,205 350,230" fill="url(#comboTopGrad)"/>
  <polygon points="280,160 680,140 740,205 350,230" fill="rgba(255,255,255,0.15)"/>

  <!-- Spine / Left Face -->
  <polygon points="280,160 350,230 350,810 280,720" fill="url(#comboSpineGrad)"/>
  <!-- Spine Content -->
  <g transform="translate(315, 480) rotate(-90)">
    <text x="0" y="0" fill="white" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4" text-anchor="middle">
      WINDOWS 11 PRO + OFFICE 2024
    </text>
  </g>

  <!-- Front Face -->
  <polygon points="350,230 740,205 740,760 350,810" fill="url(#comboFrontGrad)"/>
  <!-- Gloss overlay -->
  <polygon points="350,230 740,205 740,760 350,810" fill="url(#glassGloss)"/>

  <!-- Front Graphics -->
  <!-- Dual Badge Top -->
  <g transform="matrix(0.96 0 -0.05 0.98 385 260)">
    <rect x="0" y="0" width="280" height="42" rx="8" fill="#FFD700"/>
    <text x="140" y="27" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="20" letter-spacing="2" text-anchor="middle">
      🔥 SUPER COMBO 2 EN 1
    </text>
  </g>

  <!-- Windows Logo + Office Logo Icons Side by Side -->
  <g transform="matrix(0.96 0 -0.05 0.98 420 340)">
    <!-- Windows 11 4-Blue-Square Logo -->
    <rect x="0" y="0" width="38" height="38" rx="4" fill="#00C0F3"/>
    <rect x="44" y="0" width="38" height="38" rx="4" fill="#00A4EF"/>
    <rect x="0" y="44" width="38" height="38" rx="4" fill="#0078D4"/>
    <rect x="44" y="44" width="38" height="38" rx="4" fill="#0052cc"/>

    <!-- PLUS SIGN -->
    <text x="110" y="55" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="44" text-anchor="middle">+</text>

    <!-- Office Logo (Orange/Red Tile) -->
    <rect x="135" y="0" width="82" height="82" rx="14" fill="#D83B01"/>
    <path d="M155 22H197V60H155V22Z" fill="#F25022"/>
    <circle cx="176" cy="41" r="14" fill="white" opacity="0.95"/>
    <text x="176" y="48" fill="#D83B01" font-family="system-ui, sans-serif" font-weight="900" font-size="22" text-anchor="middle">O</text>
  </g>

  <!-- Title Text on Front Face -->
  <g transform="matrix(0.96 0 -0.05 0.98 385 470)">
    <text x="0" y="0" fill="#93C5FD" font-family="system-ui, sans-serif" font-weight="800" font-size="22" letter-spacing="3">
      MICROSOFT COMBO PACK
    </text>
    <text x="0" y="42" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="34">
      Windows 11 Pro
    </text>
    <text x="0" y="78" fill="#FFC799" font-family="system-ui, sans-serif" font-weight="900" font-size="26">
      + Office 2024 Pro Plus
    </text>

    <!-- Divider -->
    <line x1="0" y1="96" x2="310" y2="96" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

    <!-- Bullet points -->
    <text x="0" y="125" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
      ✓ 2 Claves originales digitales incluidas
    </text>
    <text x="0" y="152" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
      ✓ Licencias permanentes de por vida
    </text>
    <text x="0" y="179" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
      ✓ Activación directa en Microsoft 100% oficial
    </text>
    <text x="0" y="206" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
      ✓ Entrega instantánea por WhatsApp y Email
    </text>

    <!-- Bottom Pill -->
    <rect x="0" y="235" width="290" height="34" rx="17" fill="rgba(0,0,0,0.45)"/>
    <text x="145" y="258" fill="#4ADE80" font-family="system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="1" text-anchor="middle">
      GARANTÍA Y ACTIVACIÓN PERMANENTE
    </text>
  </g>
</svg>
