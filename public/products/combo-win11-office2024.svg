<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ground Shadows -->
    <radialGradient id="groundShadowCombo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 0, 0, 0.22)"/>
      <stop offset="60%" stop-color="rgba(0, 0, 0, 0.05)"/>
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)"/>
    </radialGradient>

    <!-- Box Drop Shadow -->
    <filter id="boxShadowCombo" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.16"/>
    </filter>

    <filter id="circlePlusShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Office Ribbon 3D Gradient Folds -->
    <linearGradient id="ribbonMainCombo" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E81123"/>
      <stop offset="35%" stop-color="#EA3E00"/>
      <stop offset="70%" stop-color="#F25022"/>
      <stop offset="100%" stop-color="#FF7800"/>
    </linearGradient>

    <linearGradient id="ribbonFrontLightCombo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="50%" stop-color="#F25022"/>
      <stop offset="100%" stop-color="#D83B01"/>
    </linearGradient>

    <linearGradient id="ribbonBottomDarkCombo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B81D00"/>
      <stop offset="100%" stop-color="#E81123"/>
    </linearGradient>

    <!-- Windows 11 Blue Header & Bloom -->
    <linearGradient id="win11HeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#005A9E"/>
    </linearGradient>

    <linearGradient id="bloomGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="50%" stop-color="#004e8c"/>
      <stop offset="100%" stop-color="#002b54"/>
    </linearGradient>

    <linearGradient id="bloomGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>

    <linearGradient id="bloomGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81d4fa"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
  </defs>

  <!-- Pure White Studio Canvas -->
  <rect width="1000" height="1000" fill="#ffffff"/>

  <!-- Floor Shadows -->
  <ellipse cx="250" cy="800" rx="190" ry="20" fill="url(#groundShadowCombo)"/>
  <ellipse cx="750" cy="800" rx="190" ry="20" fill="url(#groundShadowCombo)"/>

  <!-- ============================================== -->
  <!-- LEFT BOX: MICROSOFT OFFICE 2024 PRO PLUS -->
  <!-- ============================================== -->
  <g filter="url(#boxShadowCombo)">
    <!-- Top Cap -->
    <polygon points="55,240 435,278 435,280 95,245" fill="#f1f3f5" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- Spine (Left) -->
    <polygon points="55,240 95,245 95,785 55,780" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="56" y1="241" x2="56" y2="779" stroke="#ffffff" stroke-width="1"/>

    <!-- Spine Text -->
    <g transform="translate(75, 490) rotate(-90)">
      <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="600" font-size="19" fill="#475569" letter-spacing="1">
        Office <tspan font-weight="400" font-size="16" fill="#64748b">Professional Plus</tspan> <tspan font-weight="400" font-size="14" fill="#94a3b8">2024</tspan>
      </text>
    </g>

    <!-- Front Face -->
    <polygon points="95,245 435,278 435,745 95,785" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- Front Face Content -->
    <g transform="translate(118, 268)">
      <!-- Microsoft Logo -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="9" height="9" fill="#F25022"/>
        <rect x="11" y="0" width="9" height="9" fill="#7FBA00"/>
        <rect x="0" y="11" width="9" height="9" fill="#00A4EF"/>
        <rect x="11" y="11" width="9" height="9" fill="#FFB900"/>
        <text x="25" y="15" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="17" fill="#475569">Microsoft</text>
      </g>

      <!-- Office Title -->
      <g transform="translate(0, 70)">
        <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="36" fill="#1e293b" letter-spacing="-0.5">Office</text>
        <text x="0" y="32" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="24" fill="#334155">Professional Plus</text>
        
        <!-- 2024 Red Badge -->
        <g transform="translate(0, 46)">
          <rect x="0" y="0" width="48" height="20" rx="2" fill="#E81123"/>
          <text x="24" y="14" font-family="'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="1">2024</text>
        </g>
      </g>

      <!-- Apps List Column -->
      <g transform="translate(0, 220)">
        <!-- Word -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="24" height="24" rx="4" fill="#185ABD"/>
          <text x="12" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">W</text>
          <text x="34" y="16" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="15" fill="#334155">Word</text>
        </g>
        <!-- Excel -->
        <g transform="translate(0, 32)">
          <rect x="0" y="0" width="24" height="24" rx="4" fill="#107C41"/>
          <text x="12" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">X</text>
          <text x="34" y="16" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="15" fill="#334155">Excel</text>
        </g>
        <!-- PowerPoint -->
        <g transform="translate(0, 64)">
          <rect x="0" y="0" width="24" height="24" rx="4" fill="#C43E1C"/>
          <text x="12" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">P</text>
          <text x="34" y="16" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="15" fill="#334155">PowerPoint</text>
        </g>
        <!-- Outlook -->
        <g transform="translate(0, 96)">
          <rect x="0" y="0" width="24" height="24" rx="4" fill="#0078D4"/>
          <text x="12" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">O</text>
          <text x="34" y="16" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="15" fill="#334155">Outlook</text>
        </g>
        <!-- Teams -->
        <g transform="translate(0, 128)">
          <rect x="0" y="0" width="24" height="24" rx="4" fill="#464EB8"/>
          <text x="12" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">T</text>
          <text x="34" y="16" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="15" fill="#334155">Teams</text>
        </g>
        <!-- OneNote -->
        <g transform="translate(0, 160)">
          <rect x="0" y="0" width="24" height="24" rx="4" fill="#7719AA"/>
          <text x="12" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">N</text>
          <text x="34" y="16" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="15" fill="#334155">OneNote</text>
        </g>
        <!-- Access -->
        <g transform="translate(0, 192)">
          <rect x="0" y="0" width="24" height="24" rx="4" fill="#A4373A"/>
          <text x="12" y="17" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">A</text>
          <text x="34" y="16" font-family="'Segoe UI', Arial, sans-serif" font-weight="500" font-size="15" fill="#334155">Access</text>
        </g>
      </g>

      <!-- Office Ribbon Logo (Right Side) -->
      <g transform="translate(165, 255) scale(0.65)">
        <path d="M 40,65 C 65,25 155,20 185,55 C 215,90 220,225 220,255 C 220,285 180,315 130,320 C 80,325 45,295 45,270 C 45,250 62,240 85,245 C 110,250 145,235 155,205 C 165,175 165,95 145,70 C 125,45 85,52 62,80 Z" fill="url(#ribbonMainCombo)"/>
        <path d="M 40,65 C 40,65 10,115 10,210 C 10,275 65,305 110,305 C 65,300 35,260 35,205 C 35,125 50,90 50,90 Z" fill="url(#ribbonBottomDarkCombo)"/>
        <path d="M 155,205 C 145,235 110,250 85,245 C 62,240 45,250 45,270 C 45,295 80,325 130,320 C 180,315 220,285 220,255 C 220,225 215,90 185,55 C 175,65 170,82 170,105 C 170,170 165,190 155,205 Z" fill="url(#ribbonFrontLightCombo)"/>
      </g>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- CENTER PLUS SIGN BADGE -->
  <!-- ============================================== -->
  <g filter="url(#circlePlusShadow)">
    <circle cx="505" cy="525" r="40" fill="#D83B01"/>
    <rect x="498" y="503" width="14" height="44" rx="3.5" fill="#ffffff"/>
    <rect x="483" y="518" width="44" height="14" rx="3.5" fill="#ffffff"/>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT BOX: WINDOWS 11 (PRO / HOME) -->
  <!-- ============================================== -->
  <g filter="url(#boxShadowCombo)">
    <!-- Top Cap -->
    <polygon points="575,230 945,268 945,270 615,235" fill="#f1f3f5" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- Spine (Left) -->
    <polygon points="575,230 615,235 615,775 575,770" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
    <line x1="576" y1="231" x2="576" y2="769" stroke="#ffffff" stroke-width="1"/>

    <!-- Spine Logo & Text -->
    <g transform="translate(595, 275)">
      <rect x="-6" y="-6" width="5.5" height="5.5" fill="#0078D4"/>
      <rect x="1.5" y="-6" width="5.5" height="5.5" fill="#0078D4"/>
      <rect x="-6" y="1.5" width="5.5" height="5.5" fill="#0078D4"/>
      <rect x="1.5" y="1.5" width="5.5" height="5.5" fill="#0078D4"/>
    </g>
    <g transform="translate(595, 520) rotate(-90)">
      <text x="0" y="0" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="600" font-size="20" fill="#0078D4" letter-spacing="1">
        Windows 11 Home
      </text>
    </g>

    <!-- Front Face (White body) -->
    <polygon points="615,235 945,268 945,735 615,775" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- Front Face Blue Top Band (Header) -->
    <polygon points="615,235 945,268 945,435 615,400" fill="url(#win11HeaderGrad)"/>

    <!-- Header Content inside Blue Band -->
    <g transform="translate(638, 258)">
      <!-- Microsoft Logo (White) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="8" height="8" fill="#ffffff"/>
        <rect x="10" y="0" width="8" height="8" fill="#ffffff"/>
        <rect x="0" y="10" width="8" height="8" fill="#ffffff"/>
        <rect x="10" y="10" width="8" height="8" fill="#ffffff"/>
        <text x="24" y="14" font-family="'Segoe UI', Arial, sans-serif" font-weight="600" font-size="15" fill="#ffffff">Microsoft</text>
      </g>

      <!-- Windows 11 Title -->
      <g transform="translate(30, 85)">
        <text x="0" y="0" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="34" fill="#ffffff" letter-spacing="-0.5">
          Windows 11 Home
        </text>
      </g>
    </g>

    <!-- Bottom Graphic: Windows 11 Bloom Blue Floral Render -->
    <g transform="translate(780, 580)">
      <!-- Layered Petals of Windows 11 Bloom -->
      <path d="M-80,-60 C-40,-120 60,-110 100,-45 C130,0 115,80 55,110 C0,135 -75,105 -100,40 C-115,-10 -100,-35 -80,-60 Z" fill="url(#bloomGrad1)"/>
      <path d="M-55,-40 C-20,-85 50,-80 75,-30 C95,5 75,60 30,75 C-15,85 -65,55 -75,15 C-85,-10 -65,-20 -55,-40 Z" fill="url(#bloomGrad2)" opacity="0.9"/>
      <path d="M-30,-20 C-5,-50 35,-45 50,-10 C60,15 40,50 10,55 C-15,60 -45,40 -50,10 C-55,-5 -40,-10 -30,-20 Z" fill="url(#bloomGrad3)" opacity="0.95"/>
      <!-- Core silk highlight -->
      <path d="M-20,-15 Q0,-35 25,-15 Q40,10 15,30 Q-10,25 -20,-15" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>
</svg>
