<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="crBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140900" />
      <stop offset="50%" stop-color="#261202" />
      <stop offset="100%" stop-color="#0a0500" />
    </linearGradient>
    <linearGradient id="crOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5400" />
    </linearGradient>
    <filter id="crGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="800" rx="32" fill="url(#crBg)" />
  <rect width="796" height="796" x="2" y="2" rx="30" fill="none" stroke="#FF7A00" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- Glow accent -->
  <circle cx="400" cy="350" r="260" fill="#FF7A00" opacity="0.1" />
  
  <!-- Crunchyroll Logo Eye Icon -->
  <g transform="translate(400, 310)" filter="url(#crGlow)">
    <circle cx="0" cy="0" r="110" fill="url(#crOrange)" />
    <!-- White inner crescent -->
    <path d="M -30 -70 C 25 -70, 70 -25, 70 30 C 70 70, 45 95, 10 105 C 55 90, 85 45, 75 -15 C 65 -70, 10 -95, -30 -70 Z" fill="#FFFFFF" />
    <!-- Inner orange eyeball cutout -->
    <circle cx="15" cy="0" r="48" fill="#1e0e02" />
    <circle cx="28" cy="-8" r="22" fill="#FFFFFF" />
  </g>
  
  <!-- Crunchyroll Text -->
  <text x="400" y="490" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="62" fill="#FFFFFF" letter-spacing="1">
    crunchyroll
  </text>
  
  <!-- Badge: MEGA FAN -->
  <g transform="translate(240, 530)">
    <rect width="320" height="56" rx="28" fill="#FF7A00" fill-opacity="0.2" stroke="#FF7A00" stroke-width="2" />
    <text x="160" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#FF8A00" letter-spacing="2">
      ★ MEGA FAN PREMIUM ★
    </text>
  </g>

  <!-- Subtitle -->
  <text x="400" y="635" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#CBD5E1">
    Anime Sin Publicidad • Estrenos Simultáneos HD
  </text>
</svg>
