<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000511" />
      <stop offset="50%" stop-color="#00142e" />
      <stop offset="100%" stop-color="#000814" />
    </linearGradient>
    <linearGradient id="primeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A8E1" />
      <stop offset="100%" stop-color="#00CAFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="800" height="800" rx="32" fill="url(#bg)" />
  <rect width="796" height="796" x="2" y="2" rx="30" fill="none" stroke="#00A8E1" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Glow accent -->
  <circle cx="400" cy="400" r="280" fill="#00A8E1" opacity="0.08" />
  
  <!-- Content Group -->
  <g transform="translate(0, 0)">
    <!-- prime video Text -->
    <text x="400" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" letter-spacing="-1">
      prime <tspan fill="url(#primeBlue)">video</tspan>
    </text>
    
    <!-- Prime Smile Curve -->
    <path d="M 270 410 Q 400 485 530 410" fill="none" stroke="url(#primeBlue)" stroke-width="18" stroke-linecap="round" filter="url(#glow)" />
    <!-- Smile Arrow -->
    <path d="M 525 410 L 536 385 L 545 422 Z" fill="#00CAFF" />
    
    <!-- Badge: Suscripción Premium -->
    <g transform="translate(240, 520)">
      <rect width="320" height="56" rx="28" fill="#00A8E1" fill-opacity="0.15" stroke="#00A8E1" stroke-width="2" />
      <text x="160" y="36" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#00CAFF" letter-spacing="1">
        SUSCRIPCIÓN ULTRA HD
      </text>
    </g>

    <!-- Subtitle -->
    <text x="400" y="625" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#94A3B8">
      Películas, Series &amp; Originales • Multidispositivo
    </text>
  </g>
</svg>
