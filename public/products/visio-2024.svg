<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </radialGradient>
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.4)"/>
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.12)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.0)"/>
    </radialGradient>
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="spineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="topGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="frontGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#bgGlow)"/>
  <ellipse cx="500" cy="855" rx="360" ry="42" fill="url(#floorShadow)"/>
  <ellipse cx="490" cy="845" rx="270" ry="24" fill="rgba(15, 23, 42, 0.45)"/>

  <!-- Top Face -->
  <polygon points="280,160 680,140 740,205 350,230" fill="url(#topGrad)"/>
  <polygon points="280,160 680,140 740,205 350,230" fill="rgba(255,255,255,0.2)"/>

  <!-- Spine / Left Face -->
  <polygon points="280,160 350,230 350,810 280,720" fill="url(#spineGrad)"/>
  <g transform="translate(315, 480) rotate(-90)">
    <text x="0" y="0" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="4" text-anchor="middle">
      VISIO PROFESSIONAL 2024
    </text>
  </g>

  <!-- Front Face -->
  <polygon points="350,230 740,205 740,760 350,810" fill="url(#frontGrad)"/>
  <polygon points="350,230 740,205 740,760 350,810" fill="url(#frontGloss)"/>

  <!-- Badge -->
  <g transform="matrix(0.96 0 -0.05 0.98 385 260)">
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#60A5FA"/>
    <text x="80" y="24" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="16" letter-spacing="2" text-anchor="middle">
      EDICIÓN 2024
    </text>
  </g>

  <!-- Visio Icon 'V' & Flowchart diagram -->
  <g transform="matrix(0.96 0 -0.05 0.98 400 330)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#185ABD" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <text x="40" y="58" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle">V</text>
    
    <!-- Flowchart nodes -->
    <rect x="110" y="8" width="55" height="24" rx="4" fill="#93C5FD"/>
    <line x1="137" y1="32" x2="137" y2="44" stroke="#93C5FD" stroke-width="3"/>
    <rect x="110" y="44" width="55" height="24" rx="4" fill="#60A5FA"/>
    <line x1="165" y1="20" x2="190" y2="20" stroke="#93C5FD" stroke-width="3"/>
    <circle cx="205" cy="20" r="14" fill="#38BDF8"/>
  </g>

  <!-- Titles -->
  <g transform="matrix(0.96 0 -0.05 0.98 385 460)">
    <text x="0" y="0" fill="#93C5FD" font-family="system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="3">
      MICROSOFT
    </text>
    <text x="0" y="44" fill="white" font-family="system-ui, sans-serif" font-weight="900" font-size="34">
      Visio Pro
    </text>
    <text x="0" y="86" fill="#60A5FA" font-family="system-ui, sans-serif" font-weight="900" font-size="38">
      2024
    </text>

    <line x1="0" y1="106" x2="310" y2="106" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>

    <text x="0" y="138" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
      ✓ Licencia Perpetua Permanente
    </text>
    <text x="0" y="168" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
      ✓ Diagramas de Flujo y Procesos BPMN
    </text>
    <text x="0" y="198" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
      ✓ Esquemas de Red, UML y Planos
    </text>
    <text x="0" y="228" fill="white" font-family="system-ui, sans-serif" font-weight="700" font-size="16">
      ✓ Activación Directa 1 PC (Windows 10/11)
    </text>

    <rect x="0" y="252" width="280" height="34" rx="17" fill="rgba(0,0,0,0.4)"/>
    <text x="140" y="275" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="900" font-size="13" letter-spacing="1" text-anchor="middle">
      100% ORIGINAL Y PERMANENTE
    </text>
  </g>
</svg>
